[package]
name = "notp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
bincode = "1.3"
digest = "0.10"
dirs = "5.0"
gdk4 = { version = "0.9", optional = true }
glib = { version = "0.20", optional = true }
gtk = { version = "0.9", package = "gtk4", optional = true, features = ["v4_8"] }
hmac = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1.8", features = ["serde", "v4"] }
zeroize = "1.7"

[features]
default = ["gtk"]
gtk = ["dep:gdk4", "dep:glib", "dep:gtk"]

[dev-dependencies]
tempfile = "3.10"
