[package]
name = "notp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
build = "build.rs"

[features]
default = ["gtk", "cli", "camera"]
gtk = ["dep:gdk4", "dep:glib", "dep:gtk"]
cli = ["dep:clap"]
camera = []

[[bin]]
name = "notp-gui"
path = "src/bin/gui.rs"
required-features = ["gtk"]

[[bin]]
name = "notp-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]

[lib]
name = "notp"
path = "src/lib.rs"

[build-dependencies]
# build.rs shells out to `git` to capture the current tag so the About
# dialog can display something useful without pulling `vergen` or similar.

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
bincode = "1.3"
clap = { version = "4", features = ["derive"], optional = true }
digest = "0.10"
dirs = "5.0"
gdk4 = { version = "0.9", optional = true }
glib = { version = "0.20", optional = true }
gtk = { version = "0.9", package = "gtk4", optional = true, features = ["v4_8"] }
image = "0.23"
libc = "0.2"
url = "2"
percent-encoding = "2"
rqrr = "0.4"
hmac = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1.8", features = ["serde", "v4"] }
zeroize = "1.7"

[dev-dependencies]
tempfile = "3.10"
