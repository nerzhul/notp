name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: cargo build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (GTK4)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libgdk-pixbuf-2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgraphene-1.0-dev \
            libsoup-3.0-dev \
            libadwaita-1-dev \
            pkg-config \
            build-essential

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Build (debug)
        run: cargo build --verbose --locked --target ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --verbose --locked --target ${{ matrix.target }}

      - name: Upload debug binary
        uses: actions/upload-artifact@v4
        with:
          name: notp-debug-${{ matrix.target }}
          path: target/${{ matrix.target }}/debug/notp
          if-no-files-found: error
          retention-days: 7

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: notp-release-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/notp
          if-no-files-found: error
          retention-days: 7
