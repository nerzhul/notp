  publish:
    name: Publish GitHub Release
    #needs: [resolve-tag, build, android]
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -maxdepth 3 -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: notp ${{ needs.resolve-tag.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.resolve-tag.outputs.version, '-') }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
